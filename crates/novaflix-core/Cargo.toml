[package]
name = "novaflix-core"
description = "Núcleo de NovaFlix: catálogo, caché, descargas y transporte HTTP/FTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "gzip", "stream", "socks"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "net"] }
tokio-socks = "0.5.3"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
