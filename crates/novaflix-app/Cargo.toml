[package]
name = "novaflix"
description = "NovaFlix: explorador de catálogos multimedia públicos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
eframe = "0.36"
egui = "0.36"
egui-phosphor = "0.14.0"
egui_extras = "0.36"
novaflix-core = { path = "../novaflix-core" }
png = "0.18.1"
rfd = "0.17.2"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "NovaFlix"
identifier = "com.novatic.novaflix"
description = "Explorador de catálogos multimedia públicos"
long-description = "Explora, busca y descarga desde catálogos multimedia públicos: portada con novedades, ficha por título, descargas con reanudación, protocolos HTTP y FTP a elección y diagnóstico de red para quien está detrás de un proxy."
homepage = "https://github.com/novatic-cu/NovaFlix"
authors = ["Novatic"]
license-file = "../../LICENSE"
category = "Utility"
icons = ["../../packaging/icons/hicolor/*/apps/novaflix.png", "assets/icons/icon.ico"]
out-dir = "../../target/packager"
formats = ["deb", "appimage"]

[package.metadata.packager.deb]
package-name = "nova-flix"
section = "video"
depends = ["libegl1", "libgl1", "libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libwayland-egl1", "libx11-6", "libx11-xcb1", "libxcursor1", "libxi6", "libdbus-1-3"]
desktop-template = "../../packaging/novaflix.desktop"
