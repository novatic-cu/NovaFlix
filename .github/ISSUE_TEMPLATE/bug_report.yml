name: Bug report
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Busca primero en los issues existentes.
  - type: input
    id: version
    attributes:
      label: Versión de NovaFlix
      placeholder: "2.0.0-alpha.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Linux (deb)
        - Linux (AppImage)
        - Arch Linux
        - Windows
        - Compilado desde código
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocolo en uso (barra de estado)
      options:
        - HTTP
        - FTP
        - No lo sé
    validations:
      required: true
  - type: dropdown
    id: proxy
    attributes:
      label: ¿Te conectas detrás de un proxy?
      options:
        - "No"
        - "Sí, del sistema"
        - "Sí, personalizado"
        - No lo sé
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnóstico de red
      description: "Si el problema es de conexión: Ajustes → Red → Diagnosticar → Copiar diagnóstico, y pégalo aquí (no incluye contraseñas)."
      render: json
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir Buscar
        2. Escribir "wicked"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Arrastra imágenes o pega la salida de la consola.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He buscado issues duplicados
          required: true
        - label: Uso la última versión publicada
          required: true
