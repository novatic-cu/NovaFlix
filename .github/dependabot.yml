version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint", "emath"]
      tokio:
        patterns: ["tokio*", "hyper*", "reqwest", "rustls*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
