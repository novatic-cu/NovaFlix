name: apt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Descargar paquetes del release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p debs
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*.deb" --dir debs
          ls -la debs

      - name: Copiar sitio
        run: |
          mkdir -p public
          cp -r site/. public/

      - name: Construir repositorio APT
        run: |
          set -euo pipefail
          ARCH=amd64
          mkdir -p public/apt/pool/main "public/apt/dists/stable/main/binary-${ARCH}"
          cd public/apt

          for deb in ../../debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            prefix=$(echo "$pkg" | cut -c1)
            mkdir -p "pool/main/${prefix}/${pkg}"
            cp "$deb" "pool/main/${prefix}/${pkg}/${pkg}_${ver}_${arch}.deb"
          done

          dpkg-scanpackages --multiversion --arch "$ARCH" pool /dev/null \
            > "dists/stable/main/binary-${ARCH}/Packages"
          gzip -9c "dists/stable/main/binary-${ARCH}/Packages" \
            > "dists/stable/main/binary-${ARCH}/Packages.gz"

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=NovaFlix \
            -o APT::FTPArchive::Release::Label=NovaFlix \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="$ARCH" \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="Buscador de escritorio para catalogos multimedia publicos" \
            release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release

          cat dists/stable/Release
          head -20 "dists/stable/main/binary-${ARCH}/Packages"

      - name: Firmar repositorio
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd public/apt
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY no configurada: el repositorio se publica SIN firmar."
            rm -f novaflix.gpg
            exit 0
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "Clave: $KEY_ID"

          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            GPG_ARGS=(--batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          else
            GPG_ARGS=(--batch --yes)
          fi

          gpg "${GPG_ARGS[@]}" --local-user "$KEY_ID" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg "${GPG_ARGS[@]}" --local-user "$KEY_ID" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export "$KEY_ID" > novaflix.gpg
          gpg "${GPG_ARGS[@]}" --verify dists/stable/InRelease

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "apt: ${{ env.TAG }}"
