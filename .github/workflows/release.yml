name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            targets: ""
          - platform: windows-latest
            args: "--bundles nsis,msi"
            targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg,app"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NovaFlix ${{ github.ref_name }}"
          releaseBody: |
            NovaFlix ${{ github.ref_name }}.

            **Instaladores**
            - Linux: `.deb` y `.AppImage`
            - Windows: `.exe` (NSIS) y `.msi`
            - macOS: `.dmg` universal (Apple Silicon + Intel)
            - Arch: `novaflix-bin` vía `AUR `novaflix-bin` (paru -S novaflix-bin)`

            Cambios: ver [CHANGELOG.md](https://github.com/novatic-cu/NovaFlix/blob/main/CHANGELOG.md).

            Las builds de macOS no están firmadas ni notarizadas; abre el `.dmg` con clic derecho → Abrir la primera vez.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
